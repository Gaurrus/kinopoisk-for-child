<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Kinopoisk — настройки</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="brand__logo" aria-hidden="true">К</div>
        <div class="brand__text">
          <div class="brand__title">Kinopoisk для детей</div>
          <div class="brand__subtitle">Лимит серий на запуск</div>
        </div>
      </header>

      <section id="screen-loading" class="screen">
        <p class="muted">Загрузка…</p>
      </section>

      <section id="screen-form" class="screen" hidden>
        <p class="eyebrow" id="form-eyebrow">Перед началом</p>
        <h1 class="title" id="form-title">Сколько серий разрешить?</h1>
        <p class="muted">Лимит действует до закрытия приложения.</p>

        <div class="form">
          <label class="field">
            <span class="field__label">Количество серий</span>
            <span class="field__row">
              <input
                id="limit-input"
                class="input"
                type="number"
                min="0"
                max="99"
                step="1"
                value="2"
              />
              <span class="field__suffix">0 — без ограничений</span>
            </span>
          </label>

          <div class="field">
            <span class="field__label">Что смотрим</span>
            <div class="series">
              <div class="series__item">
                <button
                  class="series__button"
                  type="button"
                  data-url="https://hd.kinopoisk.ru/film/48609c673b79f2e589e08b9cb9c4faf5"
                >
                  Три кота
                </button>
                <button
                  class="series__link"
                  type="button"
                  data-url="https://hd.kinopoisk.ru/film/48609c673b79f2e589e08b9cb9c4faf5"
                >
                  https://hd.kinopoisk.ru/film/48609c673b79f2e589e08b9cb9c4faf5
                </button>
              </div>

              <div class="series__item">
                <button
                  class="series__button"
                  type="button"
                  data-url="https://hd.kinopoisk.ru/film/4792edeebb0ef6e585489913d2255371"
                >
                  Машины-помощники
                </button>
                <button
                  class="series__link"
                  type="button"
                  data-url="https://hd.kinopoisk.ru/film/4792edeebb0ef6e585489913d2255371"
                >
                  https://hd.kinopoisk.ru/film/4792edeebb0ef6e585489913d2255371
                </button>
              </div>
            </div>
          </div>

          <p id="form-error" class="error" hidden></p>
        </div>

        <div class="account">
          <div class="account__status">Вход сохраняется в браузере между запусками</div>
          <button id="btn-logout" class="link" type="button">Выйти из аккаунта</button>
        </div>
      </section>

      <footer class="footer">
        <span>Kinopoisk for child</span>
        <span id="version">v1.0.4</span>
      </footer>
    </main>

    <script src="./start.js"></script>
  </body>
</html>
